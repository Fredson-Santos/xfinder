[package]
name = "xfinder"
version = "0.1.0"
edition = "2021"

[lib]
name = "xfinder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri             = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
tokio             = { version = "1", features = ["full"] }
reqwest           = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite          = { version = "0.31", features = ["bundled"] }
once_cell         = "1"
chrono            = "0.4"
indexmap          = "2"

[profile.dev]
incremental = false
codegen-units = 1
split-debuginfo = "off"
debug = false
[profile.release]
codegen-units = 1
lto           = true
opt-level     = "s"
panic         = "abort"
strip         = true
