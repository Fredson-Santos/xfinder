services:
  xfinder:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: xfinder:latest
    environment:
      - PORT=2332
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - WEB_DIR=/app/web
      # Fuso usado pelo agendamento diário (sem isso o contêiner roda em UTC)
      - TZ=America/Sao_Paulo
      # Sincronização automática de todas as listas (HH:MM ou "off")
      - DAILY_SYNC_AT=03:00
    ports:
      - "2332:2332"
    volumes:
      # XFINDER_DATA: pasta do banco no host. No Dokploy, aponte para uma pasta fixa
      # (o clone do código é refeito a cada deploy); local, o padrão é ./data.
      - ${XFINDER_DATA:-./data}:/app/data
    restart: unless-stopped
