services:
  xfinder:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: xfinder:latest
    container_name: xfinder
    environment:
      - PORT=2332
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - WEB_DIR=/app/web
    ports:
      - "2332:2332"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
